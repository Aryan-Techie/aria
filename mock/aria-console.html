<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aria — Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f2f2f4;
    --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#aeaeb2;
    --line:rgba(0,0,0,.07); --line-2:rgba(0,0,0,.12);
    --aria:#5e5ce6; --aria-soft:rgba(94,92,230,.12);
    --you:#ff9f0a; --you-soft:rgba(255,159,10,.14);
    --good:#34c759; --warn:#ff9f0a; --bad:#ff3b30; --info:#0a84ff;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12);
    --r:18px;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --serif:"Instrument Serif","Iowan Old Style","Palatino",Georgia,serif;
    --mono:"SF Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
  }
  html[data-theme="dark"]{
    --bg:#000; --surface:#151517; --surface-2:#1f1f22;
    --ink:#f5f5f7; --ink-2:#98989d; --ink-3:#5c5c61;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --aria:#7d7aff; --aria-soft:rgba(125,122,255,.18);
    --you:#ffb340; --you-soft:rgba(255,179,64,.16);
    --good:#30d158; --warn:#ffd60a; --bad:#ff453a; --info:#0a84ff;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -16px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--font); background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    font-size:15px; line-height:1.45; letter-spacing:-.01em;
    transition:background .3s,color .3s;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  ::selection{background:var(--aria-soft)}

  .app{max-width:1320px;margin:0 auto;padding:0 28px 36px;min-height:100vh;display:flex;flex-direction:column}

  /* ---------- top bar ---------- */
  .top{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
  .brand .mark{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 200deg,var(--aria),#64d2ff,#bf5af2,var(--aria))}
  .brand .sub{color:var(--ink-3);font-weight:500}
  .status{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:13px;color:var(--ink-2);box-shadow:var(--shadow)}
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);transition:background .3s}
  .status.live .dot{background:var(--bad);animation:ping 1.8s ease-out infinite}
  .status.live{color:var(--ink)}
  .status.ended .dot{background:var(--good)}
  .status .time{font-variant-numeric:tabular-nums;color:var(--ink-3);min-width:38px}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,59,48,.45)}100%{box-shadow:0 0 0 9px rgba(255,59,48,0)}}
  .actions{display:flex;align-items:center;gap:8px}
  .seg{display:flex;background:var(--surface-2);border-radius:9px;padding:2px;border:1px solid var(--line)}
  .seg button{padding:4px 10px;border-radius:7px;font-size:12px;font-weight:500;color:var(--ink-2)}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .ghost{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
  .ghost:hover{color:var(--ink)}
  .ghost.on{color:var(--aria);border-color:var(--aria-soft);background:var(--aria-soft)}

  /* ---------- stage ---------- */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 0px;gap:0;flex:1;transition:grid-template-columns .6s cubic-bezier(.2,.8,.2,1),gap .6s}
  .stage[data-phase="live"],.stage[data-phase="ended"]{grid-template-columns:minmax(0,1fr) 380px;gap:32px}
  .left{display:flex;flex-direction:column;min-width:0}

  .voice{display:flex;flex-direction:column;align-items:center;position:relative;transition:height .6s cubic-bezier(.2,.8,.2,1);height:calc(100vh - 140px);min-height:420px}
  .stage[data-phase="live"] .voice{height:300px;min-height:300px}
  .stage[data-phase="ended"] .voice{height:170px;min-height:170px}
  #orb{width:100%;height:100%;display:block;position:absolute;inset:0}
  .caption{position:absolute;left:0;right:0;bottom:78px;text-align:center;font-size:15px;color:var(--ink-2);font-weight:500;letter-spacing:-.01em;transition:opacity .3s}
  .stage[data-phase="idle"] .caption{bottom:120px;font-size:22px;color:var(--ink);font-weight:500}
  .stage[data-phase="ended"] .caption{bottom:auto;top:50%;transform:translateY(-50%);left:60%;text-align:left;line-height:1.5}
  .caption em{font-style:normal;color:var(--ink-3);font-weight:400}
  .controls{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;align-items:center;gap:14px}
  .stage[data-phase="idle"] .controls{bottom:48px}
  .primary{padding:12px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;box-shadow:0 8px 24px -8px rgba(0,0,0,.35);transition:transform .15s}
  .primary:active{transform:scale(.97)}
  html[data-theme="dark"] .primary{color:#000}
  .round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink-2);transition:transform .15s,background .2s,color .2s}
  .round:hover{color:var(--ink)}
  .round:active{transform:scale(.94)}
  .round.end{background:var(--bad);color:#fff;border-color:transparent}
  .round.on{background:var(--ink);color:var(--bg)}
  .round svg{width:18px;height:18px}
  .stage[data-phase="idle"] .round,.stage[data-phase="ended"] .controls{display:none}
  .stage:not([data-phase="idle"]) .primary{display:none}
  .latency{position:absolute;right:0;top:12px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;display:flex;gap:14px}
  .latency b{font-weight:500;color:var(--ink-2)}
  .stage[data-phase="idle"] .latency{display:none}

  /* ---------- transcript ---------- */
  .tabs{display:none;gap:4px;margin:6px 0 14px;border-bottom:1px solid var(--line)}
  .tabs button{padding:8px 2px;margin-right:16px;font-size:14px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--ink);border-color:var(--ink)}
  .stage[data-phase="ended"] .tabs{display:flex}
  .feed{flex:1;overflow-y:auto;padding:8px 4px 24px;scroll-behavior:smooth;mask-image:linear-gradient(to bottom,transparent,#000 18px)}
  .feed::-webkit-scrollbar{width:0}
  .stage[data-phase="idle"] .feed{display:none}
  .turn{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:10px 0;max-width:760px;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .turn .who{font-size:12px;font-weight:600;color:var(--ink-3);padding-top:4px;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
  .turn .who i{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
  .turn.aria .who i{background:var(--aria)} .turn.you .who i{background:var(--you)}
  .turn .text{font-size:17px;line-height:1.5;letter-spacing:-.012em}
  .turn.you .text{color:var(--ink-2)}
  .turn.aria .text{color:var(--ink)}
  .turn.live .text::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-left:6px;vertical-align:middle;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.15}}
  .turn .tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:var(--warn);background:var(--you-soft);padding:2px 7px;border-radius:999px;vertical-align:middle;letter-spacing:.02em}
  .evt{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:4px 0;max-width:760px;animation:rise .3s}
  .evt .pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:5px 11px 5px 9px;border-radius:999px;box-shadow:var(--shadow)}
  .evt .pill svg{width:14px;height:14px;color:var(--aria)}
  .evt .pill .ms{color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:400}
  .evt .pill.busy svg{animation:spin 1.2s linear infinite}
  .evt .pill.good svg{color:var(--good)}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- summary ---------- */
  .summary{flex:1;overflow-y:auto;padding:4px 4px 30px;max-width:820px;animation:rise .5s}
  .summary::-webkit-scrollbar{width:0}
  .sum-top{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px;font-weight:500}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:-.005em}
  .pill.good{background:rgba(52,199,89,.14);color:#1f8f3c} html[data-theme="dark"] .pill.good{color:var(--good)}
  .pill.warn{background:var(--you-soft);color:#b46a00} html[data-theme="dark"] .pill.warn{color:var(--warn)}
  .pill.bad{background:rgba(255,59,48,.12);color:var(--bad)}
  .pill.info{background:var(--aria-soft);color:var(--aria)}
  .headline{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.12;letter-spacing:-.015em;margin:18px 0 22px;text-wrap:balance}
  .headline em{font-style:italic;color:var(--aria)}
  .action{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:18px 22px;border-radius:var(--r);background:var(--ink);color:var(--bg);margin-bottom:22px}
  html[data-theme="dark"] .action{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .action .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-bottom:4px}
  .action .v{font-size:17px;font-weight:500;letter-spacing:-.012em}
  .action button{padding:10px 16px;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap}
  html[data-theme="dark"] .action button{background:var(--ink);color:#000}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .stat{padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
  .stat .k{font-size:12px;color:var(--ink-3);font-weight:500;margin-bottom:6px}
  .stat .v{font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
  .stat .v small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:2px}
  .lists{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin-bottom:26px}
  .list h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
  .list ul{list-style:none;margin:0;padding:0}
  .list li{padding:8px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
  .list li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-3);flex:none;margin-top:8px}
  .list.risk li::before{background:var(--warn)} .list.agreed li::before{background:var(--good)} .list.owed li::before{background:var(--info)}
  .list .empty{color:var(--ink-3);font-style:italic}
  .arc{padding:16px 18px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:22px}
  .arc .k{font-size:12px;color:var(--ink-3);font-weight:500;display:flex;justify-content:space-between}
  .arc svg{width:100%;height:64px;display:block;margin-top:6px;overflow:visible}
  .sum-foot{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-3)}
  .sum-foot .ghost{margin-left:auto}

  /* ---------- sheet ---------- */
  .sheet{display:flex;flex-direction:column;gap:14px;overflow:hidden;opacity:0;transform:translateX(16px);transition:opacity .5s .2s,transform .6s cubic-bezier(.2,.8,.2,1) .1s;min-width:0}
  .stage[data-phase="live"] .sheet,.stage[data-phase="ended"] .sheet{opacity:1;transform:none}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:340px}
  .card h3{margin:0 0 12px;font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
  .card h3 span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3)}
  .company{font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:1.15;min-height:26px}
  .contact{color:var(--ink-2);font-size:13.5px;margin-top:2px;min-height:18px}
  .fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
  .field .k{font-size:11.5px;color:var(--ink-3);font-weight:500}
  .field .v{font-size:16px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;transition:color .3s}
  .field .v.big{font-size:26px}
  .field .v.hot{color:var(--aria)}
  .v.empty,.empty{color:var(--ink-3);font-weight:400}
  .pains{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .pains:empty{margin:0}
  .chip{font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);animation:rise .3s}
  .chip.warn{background:var(--you-soft);color:#b46a00} html[data-theme="dark"] .chip.warn{color:var(--warn)}
  .stepper{display:flex;align-items:center;margin-top:18px}
  .step{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);font-weight:500;flex:1}
  .step i{width:8px;height:8px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line-2);transition:all .3s;flex:none}
  .step.done i{background:var(--ink);border-color:var(--ink)} .step.done{color:var(--ink-2)}
  .step.now i{background:var(--aria);border-color:var(--aria);box-shadow:0 0 0 4px var(--aria-soft)} .step.now{color:var(--ink);font-weight:600}
  .step .bar{flex:1;height:1.5px;background:var(--line-2);margin:0 6px}
  .step.done .bar{background:var(--ink)}

  .mood{display:flex;align-items:center;justify-content:space-between}
  .mood .word{font-size:18px;font-weight:600;letter-spacing:-.02em;text-transform:capitalize;transition:color .3s}
  .trail{display:flex;gap:4px;align-items:flex-end;height:22px}
  .trail i{width:6px;border-radius:3px;background:var(--ink-3);height:8px;animation:rise .3s}
  .m-positive{color:var(--good)} .m-neutral{color:var(--ink-2)} .m-skeptical{color:var(--warn)} .m-frustrated{color:var(--bad)}
  .trail .m-positive{background:var(--good);height:22px} .trail .m-neutral{background:var(--ink-3);height:12px} .trail .m-skeptical{background:var(--warn);height:8px} .trail .m-frustrated{background:var(--bad);height:5px}
  .objs{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .objs:empty{margin:0}
  .obj{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;font-size:13px;animation:rise .3s;line-height:1.35}
  .obj .t{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);margin-top:1px;text-transform:capitalize}
  .obj .q{color:var(--ink-2)} .obj .q i{font-style:italic}
  .obj .s{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;transition:all .3s}
  .obj.ok .s{background:var(--good);border-color:var(--good);color:#fff}
  .obj .s svg{width:10px;height:10px}
  .competitors{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .competitors .k{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-right:4px}

  .ladder{margin:6px 0 10px;padding:26px 8px 30px}
  .track{position:relative;height:6px;border-radius:3px;background:var(--surface-2)}
  .track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--aria),#64d2ff);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .track .knob{position:absolute;top:50%;left:0;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2.5px solid var(--aria);transform:translate(-50%,-50%);transition:left .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .track .knob span{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--aria);white-space:nowrap;font-variant-numeric:tabular-nums}
  .stop{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
  .stop i{width:2px;height:14px;background:var(--line-2);border-radius:1px}
  .stop b{position:absolute;top:16px;font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
  .stop b small{display:block;text-align:center;font-weight:500;color:var(--ink-3);font-size:10.5px}
  .stop.hit i{background:var(--ink)}
  .rounds{display:flex;flex-direction:column;gap:8px}
  .rnd{display:grid;grid-template-columns:auto 1fr auto;gap:10px;font-size:13px;align-items:baseline;animation:rise .3s}
  .rnd .n{font-size:11px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .rnd .d{color:var(--ink-2)} .rnd .d b{color:var(--ink);font-weight:600}
  .rnd .a{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
  .rnd .a.human{background:var(--aria-soft);color:var(--aria)}
  .rnd .a.clamp{background:var(--you-soft);color:#b46a00} html[data-theme="dark"] .rnd .a.clamp{color:var(--warn)}
  .approval{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--you-soft);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:13px;animation:rise .3s}
  .approval b{display:block;font-weight:600;color:#b46a00} html[data-theme="dark"] .approval b{color:var(--warn)}
  .approval span{color:var(--ink-2)}
  .approval button{padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px}
  .approval.done{background:rgba(52,199,89,.14)} .approval.done b{color:#1f8f3c} html[data-theme="dark"] .approval.done b{color:var(--good)}

  .acts{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
  .act{display:grid;grid-template-columns:44px 1fr auto;gap:10px;font-size:13px;align-items:center;animation:rise .3s}
  .act .ts{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .act .n{color:var(--ink);font-weight:500}
  .act .n small{color:var(--ink-3);font-weight:400;margin-left:6px;font-family:var(--mono);font-size:11px}
  .act .ms{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .act .ms.slow{color:var(--warn)}
  .act .ms.busy{color:var(--aria)}
  .saved{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
  .saved b{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  .hint{color:var(--ink-3);font-size:13px;text-align:center;padding:30px 0}

  @media (max-width:980px){
    .stage[data-phase="live"],.stage[data-phase="ended"]{grid-template-columns:1fr;gap:20px}
    .sheet{transform:none} .card{min-width:0}
    .stats{grid-template-columns:1fr 1fr} .headline{font-size:32px}
    .stage[data-phase="ended"] .caption{position:static;transform:none;text-align:center;margin-top:120px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark"></span><span>Aria</span><span class="sub">Console</span></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Standby</span><span class="time" id="clock"></span></div>
    <div class="actions">
      <div class="seg" id="speed"><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
      <button class="ghost" id="micBtn" title="Drive the orb from your microphone instead of the script">Mic</button>
      <button class="ghost" id="themeBtn">Dark</button>
    </div>
  </header>

  <main class="stage" id="stage" data-phase="idle">
    <section class="left">
      <div class="voice">
        <canvas id="orb"></canvas>
        <div class="latency" id="latency"></div>
        <div class="caption" id="caption">Ready when you are</div>
        <div class="controls">
          <button class="primary" id="startBtn">Start call</button>
          <button class="round" id="muteBtn" title="Mute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button class="round end" id="endBtn" title="End call">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.6 13.9c-.9-.9-.9-2.2-.1-3.1C6 8.3 9 7 12 7s6 1.3 8.5 3.8c.8.9.8 2.2-.1 3.1l-1.6 1.6c-.7.7-1.8.8-2.6.2l-2-1.5c-.6-.5-.9-1.2-.8-1.9l.2-1.2c-1.1-.4-2.3-.4-3.4 0l.2 1.2c.1.7-.2 1.4-.8 1.9l-2 1.5c-.8.6-1.9.5-2.6-.2z"/></svg>
          </button>
        </div>
      </div>

      <div class="tabs" id="tabs"><button class="on" data-tab="summary">Brief</button><button data-tab="transcript">Transcript</button></div>
      <div class="feed" id="feed"></div>
      <div class="summary" id="summary" hidden></div>
    </section>

    <aside class="sheet" id="sheet">
      <div class="card">
        <h3>Lead <span id="leadId"></span></h3>
        <div class="company empty" id="company">Listening for a company…</div>
        <div class="contact" id="contact"></div>
        <div class="fields">
          <div class="field"><div class="k">Devices</div><div class="v big empty" id="users">—</div></div>
          <div class="field"><div class="k">Budget</div><div class="v empty" id="budget">—</div></div>
          <div class="field"><div class="k">Timeline</div><div class="v empty" id="timeline">—</div></div>
        </div>
        <div class="pains" id="pains"></div>
        <div class="stepper" id="stepper">
          <div class="step now" data-k="new"><i></i>New<span class="bar"></span></div>
          <div class="step" data-k="qualifying"><i></i>Qualifying<span class="bar"></span></div>
          <div class="step" data-k="qualified"><i></i>Qualified<span class="bar"></span></div>
          <div class="step" data-k="booked" style="flex:0"><i></i>Booked</div>
        </div>
      </div>

      <div class="card">
        <h3>Signals</h3>
        <div class="mood"><div class="word m-neutral" id="moodWord">Neutral</div><div class="trail" id="trail"><i class="m-neutral"></i></div></div>
        <div class="competitors" id="competitors" hidden><span class="k">Against</span></div>
        <div class="objs" id="objs"></div>
      </div>

      <div class="card">
        <h3>Deal <span id="dealHint">no offer yet</span></h3>
        <div class="ladder"><div class="track">
          <div class="fill" id="dealFill"></div>
          <div class="stop" style="left:16.67%" data-p="3"><i></i><b>3%<small>Aria</small></b></div>
          <div class="stop" style="left:55.56%" data-p="10"><i></i><b>10%<small>Deal desk</small></b></div>
          <div class="stop" style="left:100%" data-p="18"><i></i><b>18%<small>Floor</small></b></div>
          <div class="knob" id="dealKnob" hidden><span id="dealPct">0%</span></div>
        </div></div>
        <div class="rounds" id="rounds"></div>
        <div id="approval"></div>
      </div>

      <div class="card">
        <h3>Activity <span id="actCount"></span></h3>
        <div class="acts" id="acts"></div>
        <div class="saved"><span>Rep time handled</span><b id="savedMin">0 min</b></div>
      </div>
    </aside>
  </main>
</div>

<script>
/* =========================================================================
   State — mirrors what the backend already publishes on the session:
   transcript turns, tool_call_started/finished, qualification_updated,
   objection_logged, deal_offer_made, deal_approval_*, call_outcome_set,
   and CallSummary from app/handoff/models.py at the end.
   ========================================================================= */
const $ = (s) => document.querySelector(s);
const state = {
  phase: 'idle', speaker: 'none', startedAt: null, endedAt: null,
  turns: [], tools: [], lead: {}, sentiment: ['neutral'], objections: [],
  competitors: [], rounds: [], pending: null, approved: null, booking: null,
  outcome: null, lastTurnMs: null, speed: 1, muted: false, ariaAskedAt: null,
};
const HUMAN = {
  search_pricing_rag: 'Looked up pricing', crm_upsert_lead: 'Updated the lead',
  crm_qualify_lead: 'Qualified the lead', log_objection: 'Logged an objection',
  update_sentiment: 'Read the room', negotiate_deal: 'Went to the deal desk',
  calendar_check_availability: 'Checked the calendar', calendar_book_meeting: 'Booked the meeting',
  ask_solutions_engineer: 'Asked a solutions engineer', escalate_to_human: 'Escalated to a human',
};
const BUSY = {
  search_pricing_rag: 'Pulling those numbers up', crm_upsert_lead: 'Writing to the CRM',
  negotiate_deal: 'Checking with the deal desk', calendar_check_availability: 'Looking at the calendar',
  calendar_book_meeting: 'Booking it', log_objection: 'Noting that', crm_qualify_lead: 'Qualifying',
};
// app/metrics/savings.py — same baselines, same once-per-call set.
const BASELINE = { crm_upsert_lead: 3, crm_qualify_lead: 1, search_pricing_rag: 2, ask_solutions_engineer: 12,
  negotiate_deal: 20, calendar_check_availability: 4, calendar_book_meeting: 11, log_objection: .5, update_sentiment: 0, escalate_to_human: 0 };
const ONCE = new Set(['crm_upsert_lead', 'crm_qualify_lead', 'calendar_book_meeting']);
const ICON = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  crm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  deal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M17 7.5c0-1.7-2.2-2.5-5-2.5S7 5.8 7 7.5 9.2 10 12 10s5 .8 5 2.5-2.2 2.5-5 2.5-5-.8-5-2.5"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></svg>',
  spin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>',
};
const iconFor = (t) => t.startsWith('search') ? ICON.search : t.startsWith('crm') ? ICON.crm : t.startsWith('calendar') ? ICON.cal : t === 'negotiate_deal' ? ICON.deal : ICON.flag;

/* ========================= orb visualizer ========================= */
const orb = $('#orb'), ctx = orb.getContext('2d');
let W = 0, H = 0;
function resize() {
  const r = orb.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  orb.width = r.width * d; orb.height = r.height * d; W = r.width; H = r.height;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
new ResizeObserver(resize).observe(orb); resize();
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PAL = {
  idle: ['#a5b4fc', '#bae6fd', '#e9d5ff'], aria: ['#5e5ce6', '#64d2ff', '#bf5af2'],
  you: ['#ff9f0a', '#ff375f', '#ffd60a'], think: ['#64d2ff', '#5e5ce6', '#a5b4fc'], ended: ['#34c759', '#64d2ff', '#a5b4fc'],
};
const cur = PAL.idle.map(hex);
const bars = new Float32Array(72);
let amp = 0, t = 0, last = performance.now();
const mic = { active: false, an: null, buf: null, stream: null,
  level() { this.an.getByteTimeDomainData(this.buf); let s = 0; for (let i = 0; i < this.buf.length; i++) { const v = (this.buf[i] - 128) / 128; s += v * v; } return Math.min(1, Math.sqrt(s / this.buf.length) * 7); } };
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  const sp = state.speaker, talking = sp === 'aria' || sp === 'you';
  let target;
  if (mic.active) target = mic.level();
  else if (talking) target = 0.12 + 0.88 * Math.max(0, (Math.sin(t * 6.1) + Math.sin(t * 9.7) * .6 + Math.sin(t * 15.3) * .35 + .4) / 2.35);
  else if (sp === 'think') target = 0.16 + 0.05 * Math.sin(t * 3);
  else target = 0.07 + 0.05 * Math.sin(t * 1.1);
  amp += (target - amp) * Math.min(1, dt * 9);
  const key = state.phase === 'ended' ? 'ended' : (sp === 'none' ? 'idle' : sp);
  PAL[key].map(hex).forEach((c, i) => c.forEach((v, j) => cur[i][j] += (v - cur[i][j]) * Math.min(1, dt * 3)));
  draw(talking || mic.active);
  requestAnimationFrame(frame);
}
function draw(speaking) {
  ctx.clearRect(0, 0, W, H);
  const dark = document.documentElement.dataset.theme === 'dark';
  const cy = H / 2 - (state.phase === 'idle' ? 30 : 8);
  const cxo = state.phase === 'ended' ? W * 0.5 : W / 2;
  const base = Math.min(W, H) * (state.phase === 'idle' ? 0.27 : 0.23);
  const R = base * (1 + 0.2 * amp);
  const col = (i, a) => `rgba(${cur[i][0] | 0},${cur[i][1] | 0},${cur[i][2] | 0},${a})`;
  // halo bars
  for (let i = 0; i < 72; i++) {
    const n = 0.5 + 0.5 * Math.sin(i * 0.9 + t * 7.3) * Math.sin(i * 2.3 - t * 4.1);
    const tg = speaking ? amp * (0.35 + 0.65 * n) : 0;
    bars[i] += (tg - bars[i]) * 0.22;
    if (bars[i] < 0.01) continue;
    const a = i / 72 * Math.PI * 2, r0 = R * 1.28, len = 2 + bars[i] * base * 0.5;
    ctx.strokeStyle = col(i % 3, 0.22 + 0.5 * bars[i]); ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cxo + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cxo + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len)); ctx.stroke();
  }
  // blobs
  ctx.save(); ctx.filter = `blur(${base * 0.09}px)`; ctx.globalCompositeOperation = dark ? 'lighter' : 'source-over';
  for (let k = 0; k < 3; k++) {
    const ang = t * (0.35 + k * 0.13) + k * 2.1, off = R * 0.26 * (0.6 + amp * 0.9);
    const x = cxo + Math.cos(ang) * off, y = cy + Math.sin(ang) * off, rr = R * (0.86 + 0.08 * Math.sin(t * 2 + k));
    const g = ctx.createRadialGradient(x, y, 0, x, y, rr); g.addColorStop(0, col(k, dark ? 0.85 : 0.95)); g.addColorStop(1, col(k, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  const g2 = ctx.createRadialGradient(cxo - R * .22, cy - R * .28, 0, cxo, cy, R * .95);
  g2.addColorStop(0, `rgba(255,255,255,${dark ? .18 : .6})`); g2.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(cxo, cy, R * .95, 0, Math.PI * 2); ctx.fill();
}
requestAnimationFrame(frame);

/* ========================= UI helpers ========================= */
const feed = $('#feed');
const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
const elapsed = () => state.startedAt ? Math.floor(((state.endedAt || Date.now()) - state.startedAt) / 1000) : 0;
setInterval(() => { if (state.phase === 'live') $('#clock').textContent = fmt(elapsed()); }, 500);
const caption = (html) => { $('#caption').innerHTML = html; };
const scroll = () => { feed.scrollTop = feed.scrollHeight; };
function setSpeaker(s) {
  state.speaker = s;
  if (state.phase !== 'live') return;
  if (s === 'aria') caption('Aria is speaking');
  else if (s === 'you') caption('Listening');
  else if (s === 'none') caption('<em>Listening</em>');
}
function addTurn(role) {
  const el = document.createElement('div'); el.className = `turn ${role} live`;
  el.innerHTML = `<div class="who"><i></i>${role === 'aria' ? 'Aria' : 'You'}</div><div class="text"></div>`;
  feed.appendChild(el); scroll();
  const turn = { role, text: '', el, cancelled: false }; state.turns.push(turn); return turn;
}
function addEvent(tool, ms) {
  const el = document.createElement('div'); el.className = 'evt';
  el.innerHTML = `<div></div><div><span class="pill busy">${ICON.spin}<span>${BUSY[tool] || HUMAN[tool]}…</span></span></div>`;
  feed.appendChild(el); scroll();
  const rec = { tool, ms: null, ts: elapsed() };
  state.tools.push(rec); renderActs();
  return {
    done(cls = '') {
      rec.ms = ms; const p = el.querySelector('.pill'); p.className = `pill ${cls}`;
      p.innerHTML = `${iconFor(tool)}<span>${HUMAN[tool]}</span><span class="ms">${ms} ms</span>`;
      renderActs(); return rec;
    },
  };
}
function renderActs() {
  const box = $('#acts');
  box.innerHTML = state.tools.map((r) => `<div class="act"><span class="ts">${fmt(r.ts)}</span><span class="n">${HUMAN[r.tool]}<small>${r.tool}</small></span><span class="ms ${r.ms === null ? 'busy' : r.ms > 900 ? 'slow' : ''}">${r.ms === null ? '…' : r.ms + ' ms'}</span></div>`).join('');
  box.scrollTop = box.scrollHeight;
  $('#actCount').textContent = state.tools.length ? `${state.tools.length} tool call${state.tools.length > 1 ? 's' : ''}` : '';
  $('#savedMin').textContent = minutesSaved() + ' min';
}
function minutesSaved() {
  const seen = new Set(); let m = 0;
  for (const r of state.tools) { if (ONCE.has(r.tool)) { if (seen.has(r.tool)) continue; seen.add(r.tool); } m += BASELINE[r.tool] || 0; }
  if (state.booking) m += 4;
  return Math.round(m);
}
function tween(el, from, to, ms = 700) {
  const t0 = performance.now();
  const step = (n) => { const p = Math.min(1, (n - t0) / ms), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function setLead(patch) {
  const prev = { ...state.lead }; Object.assign(state.lead, patch); const L = state.lead;
  const set = (id, v) => { if (v == null) return; const el = $(id); el.textContent = v; el.classList.remove('empty'); };
  set('#company', L.company); set('#contact', L.contact); set('#budget', L.budget); set('#timeline', L.timeline);
  if (L.lead_id) $('#leadId').textContent = L.lead_id;
  if (patch.user_count != null) { const el = $('#users'); el.classList.remove('empty'); tween(el, prev.user_count || 0, patch.user_count); el.classList.add('hot'); setTimeout(() => el.classList.remove('hot'), 1600); }
  if (patch.pain_points) $('#pains').innerHTML = L.pain_points.map((p) => `<span class="chip">${p}</span>`).join('');
  const order = ['new', 'qualifying', 'qualified', 'booked'], i = order.indexOf(L.stage || 'new');
  document.querySelectorAll('.step').forEach((s, j) => { s.classList.toggle('done', j < i); s.classList.toggle('now', j === i); });
}
function setSentiment(s) {
  state.sentiment.push(s); $('#moodWord').textContent = s; $('#moodWord').className = `word m-${s}`;
  $('#trail').innerHTML = state.sentiment.slice(-14).map((x) => `<i class="m-${x}"></i>`).join('');
}
function addCompetitor(name) {
  state.competitors.push(name); const c = $('#competitors'); c.hidden = false; c.insertAdjacentHTML('beforeend', `<span class="chip warn">${name}</span>`);
}
function addObjection(topic, text) {
  const o = { topic, text, resolved: false }; state.objections.push(o);
  $('#objs').insertAdjacentHTML('beforeend', `<div class="obj" data-i="${state.objections.length - 1}"><span class="t">${topic}</span><span class="q"><i>“${text}”</i></span><span class="s">${ICON.check}</span></div>`);
  return o;
}
function resolveObjection(o) { o.resolved = true; $(`.obj[data-i="${state.objections.indexOf(o)}"]`).classList.add('ok'); }
function addRound(r) {
  state.rounds.push(r); const pct = r.granted;
  $('#dealHint').textContent = `${pct}% in force`;
  $('#dealFill').style.width = (pct / 18 * 100) + '%';
  const k = $('#dealKnob'); k.hidden = false; k.style.left = (pct / 18 * 100) + '%'; $('#dealPct').textContent = pct + '%';
  document.querySelectorAll('.stop').forEach((s) => s.classList.toggle('hit', +s.dataset.p <= pct));
  $('#rounds').insertAdjacentHTML('beforeend', `<div class="rnd"><span class="n">R${r.round}</span><span class="d">${r.ask} → <b>${pct}% off</b>${r.asked_for ? `, for ${r.asked_for}` : ''}</span><span class="a ${r.by === 'human' ? 'human' : r.clamped ? 'clamp' : ''}">${r.clamped ? `held at ${pct}` : r.by.replace('_', ' ')}</span></div>`);
}
function requestApproval(pct) {
  state.pending = pct;
  $('#approval').innerHTML = `<div class="approval"><div><b>${pct}% needs a signature</b><span>Desk stops at 10%. Call is still live.</span></div><button id="approveBtn">Approve ${pct}%</button></div>`;
  return new Promise((res) => {
    const go = () => {
      if (!state.pending) return; state.pending = null; state.approved = { pct, by: 'R. Mehta' };
      $('#approval').innerHTML = `<div class="approval done"><div><b>${pct}% signed off</b><span>by R. Mehta, mid-call</span></div></div>`; res();
    };
    $('#approveBtn').onclick = go; wait(4200).then(go);
  });
}

/* ========================= scripted demo ========================= */
let abort = false;
const wait = (ms) => new Promise((r) => setTimeout(r, ms / state.speed));
async function say(role, text, { wpm = 165 } = {}) {
  if (abort) return; setSpeaker(role);
  const turn = addTurn(role), words = text.split(' '), per = 60000 / wpm;
  if (role === 'aria' && state.ariaAskedAt) {
    state.lastTurnMs = 520 + Math.round(Math.random() * 260);
    $('#latency').innerHTML = `<span>Turn <b>${state.lastTurnMs} ms</b></span><span>Voice <b>Sarvam · en-IN</b></span>`; state.ariaAskedAt = null;
  }
  for (let i = 0; i < words.length; i++) {
    if (abort || turn.cancelled) break;
    turn.text += (i ? ' ' : '') + words[i]; turn.el.querySelector('.text').textContent = turn.text; scroll();
    await wait(per * (0.7 + Math.random() * 0.6) + (/[.,?!]$/.test(words[i]) ? 220 : 0));
  }
  turn.el.classList.remove('live');
  if (turn.cancelled) turn.el.querySelector('.text').insertAdjacentHTML('beforeend', '<span class="tag">interrupted</span>');
  if (role === 'you') state.ariaAskedAt = Date.now();
  setSpeaker('none'); return turn;
}
async function tool(name, ms, cls) {
  if (abort) return; setSpeaker('think'); caption(`${BUSY[name] || HUMAN[name]}…`);
  const ev = addEvent(name, ms); await wait(ms); if (abort) return; ev.done(cls); setSpeaker('none');
}
async function demo() {
  await wait(900);
  await say('aria', 'Hi, this is Aria with Apple Business. What can I help you with today?');
  await wait(700);
  await say('you', 'Hi — we’re looking at moving our team over to Mac and iPhone. What would that actually cost us?');
  await wait(300);
  await tool('search_pricing_rag', 412);
  await say('aria', 'Happy to walk you through it. MacBook Air starts at $999 a device and iPhone 16 from $799, and once you’re past twenty devices volume pricing kicks in. Roughly how many people are we talking about, and which company is this for?');
  await say('you', 'Northwind Logistics. About ten to start, maybe more later.');
  await tool('crm_upsert_lead', 238);
  setLead({ lead_id: 'LD-2418', company: 'Northwind Logistics', contact: 'Priya Sharma · Head of IT', user_count: 10, stage: 'qualifying' });
  const p = say('aria', 'Got it, ten devices. At that size you’d be looking at around $18,000 up front for a Mac and iPhone pairing per person, and I can put together a');
  await wait(2600); if (abort) return; state.turns.at(-1).cancelled = true; await p;
  await say('you', 'Wait, that’s a lot more than what we pay for our Windows laptops right now.');
  await tool('log_objection', 90);
  addObjection('pricing', 'that’s a lot more than our Windows laptops'); addCompetitor('Windows / Dell');
  setSentiment('skeptical');
  await tool('search_pricing_rag', 530);
  await say('aria', 'That’s fair, and sticker price is the wrong comparison. Over three years a Mac fleet costs less to run: fewer support tickets, a longer usable life, and a resale value your PCs don’t have. Most of our business customers land about $840 per device cheaper across that window.');
  await say('you', 'Hm. Okay, that’s more reasonable than I expected.');
  if (abort) return; resolveObjection(state.objections[0]); setSentiment('neutral');
  setLead({ pain_points: ['support ticket volume', 'device refresh cost'] });
  await say('you', 'Actually, it’d be more like fifty people, not ten.');
  await tool('crm_upsert_lead', 201);
  setLead({ user_count: 50, budget: '$60–80k', timeline: 'Q4' });
  await say('aria', 'Fifty changes things — that puts you on volume pricing, so the per-device cost comes down before we talk about anything else. Is there a budget you’re working to?');
  await say('you', 'Sixty to eighty thousand this quarter. But our CFO wants to see something on price. What can you do?');
  await tool('negotiate_deal', 1180);
  addRound({ round: 1, ask: 'CFO wants a discount', granted: 3, by: 'aria', asked_for: 'a 50-device floor' });
  setLead({ stage: 'qualified' });
  await say('aria', 'I can take three percent off list on my own if you can commit to the fifty-device floor. That puts you at roughly $69,000 for the fleet.');
  await say('you', 'He’s going to want more than that. Can you get to twelve?');
  await tool('negotiate_deal', 1420);
  addRound({ round: 2, ask: 'Asked for 12%', requested: 12, granted: 10, by: 'deal_desk', clamped: true, asked_for: 'a decision by the 30th' });
  setSentiment('skeptical');
  await say('aria', 'Let me check with our deal desk. I can go to ten percent if you can give us a decision by the thirtieth. Twelve is past what I can sign, so I’ve sent that to my manager — it won’t hold us up.');
  const approve = requestApproval(12);
  await say('you', 'Okay. The thirtieth works if twelve comes through.');
  await approve; if (abort) return;
  addRound({ round: 3, ask: '12% approved', granted: 12, by: 'human', asked_for: 'a single PO' });
  await say('aria', 'Good news, my manager just signed off on twelve percent. That’s about $62,400 for fifty devices, on a single purchase order. Shall I put that in writing?');
  setSentiment('positive');
  await say('you', 'Yes. And can we get someone to walk our IT team through the migration?');
  await tool('calendar_check_availability', 640);
  await say('aria', 'Of course. Our Apple Business specialist for your region has Thursday at 11, or Friday at 2 in the afternoon. Which suits your team?');
  await say('you', 'Thursday at 11.');
  await tool('calendar_book_meeting', 812, 'good');
  if (abort) return;
  state.booking = { when: 'Thursday 11:00', who: 'Apple Business specialist', rep: 'D. Kapoor' }; setLead({ stage: 'booked' });
  await say('aria', 'Done. Thursday at eleven with Devika Kapoor, and the invite and the quote are on their way to you now. Thanks, Priya, we’ll talk Thursday.');
  await wait(1200);
  end();
}

/* ========================= lifecycle ========================= */
function start() {
  abort = false;
  Object.assign(state, { phase: 'live', startedAt: Date.now(), endedAt: null, turns: [], tools: [], lead: {}, sentiment: ['neutral'], objections: [], competitors: [], rounds: [], pending: null, approved: null, booking: null, outcome: null, ariaAskedAt: null });
  $('#stage').dataset.phase = 'live'; $('#status').className = 'status live'; $('#statusText').textContent = 'Live'; $('#clock').textContent = '00:00';
  feed.innerHTML = ''; $('#summary').hidden = true; feed.hidden = false; caption('<em>Connecting</em>');
  setTimeout(() => { if (state.phase === 'live' && state.speaker === 'none') caption('<em>Listening</em>'); }, 800);
  demo();
}
function end() {
  if (state.phase !== 'live') return; abort = true; state.endedAt = Date.now(); state.phase = 'ended'; setSpeaker('none');
  state.outcome = state.booking ? 'meeting_booked' : state.lead.stage === 'qualified' ? 'qualified' : 'follow_up';
  $('#stage').dataset.phase = 'ended'; $('#status').className = 'status ended'; $('#statusText').textContent = 'Ended'; $('#clock').textContent = fmt(elapsed());
  document.querySelectorAll('.turn.live').forEach((e) => e.classList.remove('live'));
  caption(`Call ended · ${fmt(elapsed())}<br><em>Brief sent to the rep, CRM note written, invite out.</em>`);
  renderSummary(); showTab('summary');
}
function renderSummary() {
  const L = state.lead, dur = elapsed(), turns = state.turns.length, lastRound = state.rounds.at(-1), disc = lastRound ? lastRound.granted : 0;
  const label = { meeting_booked: ['good', 'Meeting booked'], qualified: ['info', 'Qualified'], follow_up: ['warn', 'Follow up'], escalated: ['bad', 'Escalated'] }[state.outcome];
  const facts = [L.user_count && `${L.user_count} devices, Mac and iPhone`, L.budget && `Budget ${L.budget}`, L.timeline && `Timeline ${L.timeline}`, L.pain_points && L.pain_points.length && `Driving it: ${L.pain_points.join(', ')}`].filter(Boolean);
  const agreed = [
    disc && `${disc}% off list was offered and stands (round ${state.rounds.length}, authorised by ${lastRound.by.replace('_', ' ')})`,
    disc && `Quoted: 50 devices at about $${(1248 * (1 - disc / 100) * 50 / 1000).toFixed(1)}k, single PO`,
    state.approved && `${state.approved.pct}% approved by ${state.approved.by} during the call`,
    state.booking && `${state.booking.who} walkthrough booked for ${state.booking.when}; invite has gone out`,
  ].filter(Boolean);
  const owed = [...new Set(state.rounds.map((r) => r.asked_for).filter(Boolean))].map((x) => `They were asked for ${x}`);
  if (state.pending) owed.push('A discount approval is still open; she told them it was with her manager');
  const risks = [
    ...state.objections.filter((o) => !o.resolved).map((o) => `Unresolved ${o.topic} objection: “${o.text}”`),
    state.competitors.length && `Competing quotes in play: ${state.competitors.join(', ')}`,
    ['skeptical', 'frustrated'].includes(state.sentiment.at(-1)) && `They ended the call sounding ${state.sentiment.at(-1)}`,
  ].filter(Boolean);
  const head = {
    meeting_booked: `Northwind wants <em>fifty Macs by Q4</em>, agreed to 12% on a single PO, and has an IT walkthrough booked for Thursday.`,
    qualified: `Northwind is a qualified fifty-device Mac opportunity for Q4 with pricing agreed but nothing booked yet.`,
    follow_up: `A short call with ${L.company || 'an unknown caller'} that ended before anything was agreed.`,
  }[state.outcome];
  const action = {
    meeting_booked: ['today', 'Send the written 12% quote before the Thursday walkthrough so the CFO has it in hand.'],
    qualified: ['today', 'Book the IT walkthrough Aria offered; the slot is still open.'],
    follow_up: ['this week', `Call ${L.contact ? L.contact.split(' ')[0] : 'them'} back and pick up where the call ended.`],
  }[state.outcome];
  const li = (a) => `<ul>${a.length ? a.map((x) => `<li>${x}</li>`).join('') : '<li class="empty">Nothing captured</li>'}</ul>`;
  const Y = { positive: 8, neutral: 30, skeptical: 48, frustrated: 60 };
  const pts = state.sentiment.map((s, i) => [i / Math.max(1, state.sentiment.length - 1) * 100, Y[s]]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1]).join(' ');
  const mins = minutesSaved();
  $('#summary').innerHTML = `
    <div class="sum-top"><span class="pill ${label[0]}">${label[1]}</span><span>${L.company || 'Unknown caller'}${L.contact ? ' · ' + L.contact.split(' ·')[0] : ''}</span><span>·</span><span>${fmt(dur)}, ${turns} turns</span></div>
    <h1 class="headline">${head}</h1>
    <div class="action"><div><div class="k">Do next · ${action[0]}</div><div class="v">${action[1]}</div></div><button>Open lead ${L.lead_id || ''}</button></div>
    <div class="stats">
      <div class="stat"><div class="k">On the call</div><div class="v">${fmt(dur)}</div></div>
      <div class="stat"><div class="k">Rep time handled</div><div class="v">${mins >= 60 ? Math.floor(mins / 60) + '<small>h</small> ' + (mins % 60) : mins}<small>min</small></div></div>
      <div class="stat"><div class="k">Discount in force</div><div class="v">${disc}<small>%</small></div></div>
      <div class="stat"><div class="k">Tool calls</div><div class="v">${state.tools.length}</div></div>
    </div>
    <div class="lists">
      <div class="list"><h4>What they need</h4>${li(facts)}</div>
      <div class="list agreed"><h4>What was agreed</h4>${li(agreed)}</div>
      <div class="list owed"><h4>What we owe them</h4>${li(owed)}</div>
      <div class="list risk"><h4>Watch out for</h4>${li(risks)}</div>
    </div>
    <div class="arc"><div class="k"><span>How it felt, start to finish</span><span class="m-${state.sentiment.at(-1)}" style="text-transform:capitalize;font-weight:600">${state.sentiment.at(-1)}</span></div>
      <svg viewBox="0 0 100 68" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#34c759"/><stop offset=".5" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff3b30"/></linearGradient></defs><path d="${path}" fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--surface)" stroke="var(--ink-2)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`).join('')}</svg></div>
    <div class="sum-foot"><span>Handled end to end by Aria.</span><span>Also in EspoCRM, Slack and the rep's inbox.</span><button class="ghost" id="copyBtn">Copy brief</button></div>`;
  $('#copyBtn').onclick = () => {
    const txt = `${L.company || 'Unknown caller'}${L.contact ? ' / ' + L.contact : ''} - ${label[1]}\n\n${head.replace(/<[^>]+>/g, '')}\n\nDo next (${action[0]}): ${action[1]}\n\nWhat they need:\n${facts.map((f) => '- ' + f).join('\n')}\n\nWhat was agreed:\n${agreed.map((f) => '- ' + f).join('\n')}\n\nWhat we owe them:\n${owed.map((f) => '- ' + f).join('\n')}\n\nWatch out for:\n${risks.map((f) => '- ' + f).join('\n')}\n\nCall length ${Math.floor(dur / 60)}m ${dur % 60}s, ${turns} turns, handled end to end by Aria.`;
    if (navigator.clipboard) navigator.clipboard.writeText(txt); $('#copyBtn').textContent = 'Copied';
  };
}
function showTab(k) {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === k));
  $('#summary').hidden = k !== 'summary'; feed.hidden = k !== 'transcript';
}

/* ========================= wiring ========================= */
$('#startBtn').onclick = start;
$('#endBtn').onclick = end;
$('#tabs').onclick = (e) => e.target.dataset.tab && showTab(e.target.dataset.tab);
$('#speed').onclick = (e) => { if (!e.target.dataset.s) return; state.speed = +e.target.dataset.s; document.querySelectorAll('#speed button').forEach((b) => b.classList.toggle('on', b === e.target)); };
$('#muteBtn').onclick = (e) => { state.muted = !state.muted; e.currentTarget.classList.toggle('on', state.muted); e.currentTarget.title = state.muted ? 'Unmute' : 'Mute'; };
$('#micBtn').onclick = async (e) => {
  const btn = e.currentTarget;
  if (mic.active) { mic.stream.getTracks().forEach((t) => t.stop()); mic.active = false; btn.classList.remove('on'); return; }
  try {
    mic.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new AudioContext(); const src = ac.createMediaStreamSource(mic.stream);
    mic.an = ac.createAnalyser(); mic.an.fftSize = 1024; mic.buf = new Uint8Array(mic.an.fftSize); src.connect(mic.an);
    mic.active = true; btn.classList.add('on');
  } catch { btn.textContent = 'Mic blocked'; }
};
const root = document.documentElement;
const applyTheme = (d) => { root.dataset.theme = d ? 'dark' : 'light'; $('#themeBtn').textContent = d ? 'Light' : 'Dark'; };
applyTheme(matchMedia('(prefers-color-scheme: dark)').matches);
$('#themeBtn').onclick = () => applyTheme(root.dataset.theme !== 'dark');
document.addEventListener('keydown', (e) => { if (e.key === ' ' && state.phase === 'idle') { e.preventDefault(); start(); } if (e.key === 'Escape' && state.phase === 'live') end(); });
</script>
